name: Veille marketing digital

on:
  # GitHub documente que l'événement `schedule` peut être retardé en période de
  # forte charge, et que « les périodes de forte charge incluent le début de
  # chaque heure » — certains jobs pouvant même être abandonnés. Le premier
  # réglage utilisait 0 6 et 0 7, soit exactement le créneau déconseillé : rien
  # ne s'est déclenché le premier matin.
  #
  # D'où deux corrections : on évite l'heure pile, et on prévoit des créneaux de
  # rattrapage. Le script étant idempotent — il sort immédiatement si la journée
  # est déjà publiée — seul le premier créneau qui aboutit fait le travail, les
  # suivants ne consomment rien.
  schedule:
    - cron: '17 6 * * *'    # 08h17 à Paris en été, 07h17 en hiver
    - cron: '17 8 * * *'    # rattrapage si le premier a été retardé ou abandonné
    - cron: '17 11 * * *'   # dernier filet
  workflow_dispatch:

permissions:
  contents: write   # pousser la veille du jour
  models: read      # inférence via GitHub Models (gratuit, aucune clé à gérer)

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Générer la veille du jour
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Une exécution manuelle régénère la journée même si elle est déjà
          # publiée ; les exécutions planifiées respectent l'idempotence.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/generate.mjs

      - name: Publier
        run: |
          git config user.name "Veille automatique"
          git config user.email "action@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Aucun changement — rien à publier."
            exit 0
          fi
          git commit -m "Veille du $(TZ=Europe/Paris date +%d/%m/%Y)"
          git push
